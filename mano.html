<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mano Navigation</title>
  <style>
    :root {
      --bg-dark: #0b1220;
      --bg-mid: #101b2d;
      --panel: #16263f;
      --panel-2: #1d3557;
      --primary: #3ec6c6;
      --primary-2: #22a7b7;
      --accent: #f2c94c;
      --text: #eaf4ff;
      --muted: #b8c8dd;
      --shadow: rgba(7, 17, 30, 0.45);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid) 40%, var(--panel-2));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .wrapper {
      width: min(100%, 1100px);
      background: rgba(15, 26, 42, 0.78);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 28px 60px var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .topbar {
      background: linear-gradient(90deg, rgba(24, 48, 76, 0.9), rgba(20, 36, 58, 0.95));
      border-bottom: 1px solid var(--border);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.02);
    }

    .nav-btn {
      border: 1px solid rgba(62, 198, 198, 0.4);
      background: linear-gradient(135deg, rgba(22, 38, 63, 0.95), rgba(29, 53, 87, 0.9));
      color: var(--text);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 14px 24px;
      min-width: 170px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(242, 201, 76, 0.8);
      box-shadow: 0 14px 22px rgba(34, 167, 183, 0.18);
    }

    .nav-btn:active {
      transform: translateY(0);
    }

    .nav-btn:nth-child(odd) {
      background: linear-gradient(135deg, rgba(24, 62, 79, 0.95), rgba(13, 32, 45, 0.9));
    }

    .nav-btn:nth-child(even) {
      background: linear-gradient(135deg, rgba(22, 38, 63, 0.95), rgba(27, 52, 92, 0.9));
    }

    @media (max-width: 640px) {
      .nav-btn {
        width: 100%;
        min-width: unset;
      }

      .brand {
        letter-spacing: 0.08em;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="topbar">
      <div class="brand">Mano Portal</div>
    </div>

    <div class="nav">
      <button class="nav-btn" type="button" onclick="openPage('index.html')">Home</button>
      <button class="nav-btn" type="button" onclick="openPage('Order.html')">Create Order</button>
      <button class="nav-btn" type="button" onclick="openPage('AdminMano.html')">Download Order</button>
      <button class="nav-btn" type="button" onclick="openPage('quotation.html')">Quotation</button>
      <button class="nav-btn" type="button" onclick="openPage('invoice.html')">Invoice</button>
      <button class="nav-btn" type="button" onclick="openPage('AdminPage.html')">Admin</button>
    </div>
  </div>

  <script>
    function openPage(pageName) {
      window.location.href = pageName;
    }
  </script>
</body>
</html>
